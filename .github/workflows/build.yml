name: Compilar ATRIL

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar como release"
        type: boolean
        default: false

# Permisos mínimos: solo lectura por defecto; el trabajo de Windows pide lo justo para publicar
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Pruebas (incluye el motor de animaciones con Chrome sin ventana)
        run: npx vitest run
        env:
          CHROME_PATH: /usr/bin/google-chrome

  windows:
    name: Windows (.exe e instalador)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write        # publicar la versión
      id-token: write        # certificado de procedencia (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: src-tauri }
      - name: Descargar ffmpeg (verificado) — único binario auxiliar
        shell: pwsh
        run: |
          $base = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          $name = "ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest "$base/$name" -OutFile ffmpeg.zip
          # Huella publicada por el autor de la compilación: si existe y no coincide, no se publica nada
          $got = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "ffmpeg.zip SHA-256: $got"
          try { Invoke-WebRequest "$base/checksums.sha256" -OutFile checksums.sha256 } catch { Write-Warning "Sin archivo de huellas publicado: se registra la huella calculada" }
          if (Test-Path checksums.sha256) {
            $line = Select-String -Path checksums.sha256 -Pattern ([regex]::Escape($name)) | Select-Object -First 1
            if (-not $line) { throw "El archivo de huellas no menciona $name" }
            $want = $line.Line.Split(" ")[0].ToLower()
            if ($want -ne $got) { throw "La huella de ffmpeg no coincide con la publicada ($want)" }
            Write-Host "Huella verificada"
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = Get-ChildItem -Recurse ffmpeg-dl -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          # Lo que ATRIL necesita de ffmpeg: si falta algo, la compilación falla aquí y no en tu equipo
          $enc = & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -encoders | Out-String
          $flt = & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -filters | Out-String
          foreach ($x in "libx264", "aac") { if ($enc -notmatch " $x ") { throw "ffmpeg sin el codificador $x" } }
          foreach ($x in "h264_qsv", "h264_mf") { if ($enc -notmatch " $x ") { Write-Warning "ffmpeg sin $x (se usará x264)" } }
          foreach ($x in "subtitles", "xfade", "zoompan", "sidechaincompress", "silencedetect", "showinfo") { if ($flt -notmatch " $x ") { throw "ffmpeg sin el filtro $x" } }
      - run: npm ci
      - name: Compilar con Tauri
        run: npx tauri build
      - name: Reunir entregables
        id: pack
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force out, portable | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe "out/ATRIL_${v}_instalador_x64.exe"
          $main = Get-ChildItem src-tauri/target/release -Filter *.exe | Where-Object { $_.Name -notmatch '^ffmpeg' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "Ejecutable principal: $($main.Name)"
          Copy-Item $main.FullName portable/ATRIL.exe
          Copy-Item src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe portable/ffmpeg.exe
          Copy-Item -Recurse src-tauri/resources portable/resources
          @"
          ATRIL $v — versión portátil
          Descomprime la carpeta completa (ATRIL.exe necesita ffmpeg.exe y la carpeta resources a su lado).
          Requiere Microsoft Edge WebView2 (incluido en Windows 11).
          Para instalar con acceso directo y desinstalador, usa ATRIL_${v}_instalador_x64.exe.
          "@ | Out-File -Encoding utf8 portable/LEEME.txt
          Compress-Archive -Path portable/* -DestinationPath "out/ATRIL_${v}_portable_x64.zip"
          # Huellas SHA-256 de cada entregable (la app y la página las comparan antes de instalar)
          # Se calculan antes de crear el archivo para que no se lea a sí mismo mientras se escribe
          $sums = @(Get-ChildItem out -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" })
          $sums | Out-File -Encoding ascii out/SHA256SUMS.txt
          Get-ChildItem out | Format-Table Name, Length
          Get-Content out/SHA256SUMS.txt
      - name: Certificado de procedencia (Sigstore)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) || contains(github.event.head_commit.message, '[release]')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "out/ATRIL_*"
      - uses: actions/upload-artifact@v4
        with:
          name: ATRIL-windows
          path: out/*
          if-no-files-found: error
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.pack.outputs.version }}
          name: ATRIL ${{ steps.pack.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: docs/RELEASE_NOTES.md
          files: out/*
          make_latest: true
